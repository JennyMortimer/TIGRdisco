[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tigrdisco"
version = "1.2.6"
description = "Discovery of TIGR arrays and TIGR-associated (Tas) proteins from nucleotide sequences"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "Siwen Gu"}]
dependencies = [
    "numpy>=1.24",
    "biopython>=1.81",
    "regex>=2023.0",
    "pyhmmer>=0.10",
    "pyrodigal>=3.0",
    "Pillow>=10.1",
    "XlsxWriter>=3.1",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/JennyMortimer/TIGRdisco"
Repository = "https://github.com/JennyMortimer/TIGRdisco"
Issues = "https://github.com/JennyMortimer/TIGRdisco/issues"
Preprint = "https://doi.org/10.64898/2026.11.04.764119"

[project.scripts]
tigrdisco-export = "tigrdisco.export_xlsx:main"
tigrdisco = "tigrdisco.cli:main"
tigrdisco-db = "tigrdisco.run_database:main"
tigrdisco-fasta = "tigrdisco.run_fasta:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tigrdisco*"]

[tool.setuptools.package-data]
tigrdisco = ["data/*.hmm", "data/*.hmm3"]
