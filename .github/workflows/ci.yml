name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test, FASTA mode with Excel reports
        run: tigrdisco-fasta examples/example_windows.fa --out demo_fasta --workers 2 --limit 20 --xlsx
      - name: Smoke test, GenBank mode
        run: tigrdisco-db examples/example_central.gb --out demo_db --workers 2
